# Deploys this site on Render with a persistent disk, so the database and the
# payment screenshots survive a restart or a redeploy.
#
# How to use it:
#   1. Push this repository to GitHub.
#   2. In Render: New > Blueprint, then choose this repository.
#   3. Render asks for the secret below (the organizer password). Type it in.
#   4. Create the Blueprint. The first deploy takes a few minutes.
#
# A persistent disk requires a paid instance type, which is why the plan is
# starter. Keep the service at one instance: the database is a single file and
# two instances cannot share it.
services:
  - type: web
    name: badminton-registration
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # Closest available region to India. Other choices: frankfurt, ohio, oregon.
    region: singapore
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: ADMIN_USERNAME
        value: subhan
      # Set this in the Render dashboard. It is never stored in the repository.
      - key: ADMIN_PASSWORD
        sync: false
    # The image already points DATA_DIR and UPLOAD_DIR at /data, so the disk
    # is mounted there and nothing else has to be configured.
    disk:
      name: badminton-data
      mountPath: /data
      sizeGB: 1
